<!-- 只输出首张照片；其余资料留在惰性模板里，脚本按需加载下一张。 -->
<div class="photo-slot photo-slideshow {{ include.class }}" style="--photo-ratio:{{ include.ratio | default: '1.5' }}" data-photo-slideshow data-slideshow-initial="{{ include.image | relative_url }}" data-slideshow-baseurl="{{ site.baseurl | escape }}" data-slideshow-interval="3000" role="group" aria-roledescription="图片轮播" aria-label="{{ include.title | escape }}" aria-keyshortcuts="ArrowLeft ArrowRight Space"{% unless include.link %} tabindex="0"{% endunless %}>
  {% if include.link %}<a class="slideshow-link" href="{{ include.image | relative_url }}" data-lightbox data-sequence="{{ include.sequence }}" data-title="{{ include.title | escape }}" data-label="{{ include.label | escape }}" data-note="{{ include.note | escape }}" data-image="{{ include.image | relative_url }}" aria-label="浏览{{ include.title | escape }}">{% endif %}
  <img class="slideshow-image is-current" {% include photo-attributes.html image=include.image sizes=include.sizes %} alt="{{ include.title | escape }}" loading="{% if include.eager %}eager{% else %}lazy{% endif %}" decoding="async"{% if include.eager %} fetchpriority="high"{% endif %}>
  <img class="slideshow-image" alt="" aria-hidden="true" decoding="async">
  {% if include.link %}</a>{% endif %}
  <span class="slot-caption"><span data-slideshow-title>{{ include.title }}</span></span>
  <template data-slideshow-data>[{% for slide in include.slides %}{% assign slide_variants = site.data.photo_variants[slide.image] %}{"photo":{{ slide | jsonify | escape }}{% if slide_variants %},"preview":{{ slide_variants.thumbnail.image | jsonify | escape }},"display":{{ slide_variants.display.image | jsonify | escape }},"preview_width":{{ slide_variants.thumbnail.width }},"display_width":{{ slide_variants.display.width }}{% endif %}}{% unless forloop.last %},{% endunless %}{% endfor %}]</template>
</div>
